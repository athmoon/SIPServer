plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sipserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.sipserver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // JAIN-SIP 核心库
    implementation 'javax.sip:jain-sip-api:1.2'
    implementation 'javax.sip:jain-sip-ri:1.2'

    
    // Android核心库
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    
    // 网络和并发
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // 日志
    implementation 'org.slf4j:slf4j-api:2.0.9'
    // implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'com.github.tony19:logback-android:2.0.1'
    
    // JSON处理
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
